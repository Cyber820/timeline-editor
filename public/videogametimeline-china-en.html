## 2) 英文版中国电子游戏时间轴 HTML（完整替换版，含初始时间范围）

你给的示例我按“初始时间范围放在 HTML”的要求改造，并把参数注入集中到同一个 `<script>` 里，确保加载顺序稳定。

```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chinese Video Game Timeline (English)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css">
  <script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>

  <style>
    body { font-family: system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif; }
    .topbar { display:flex; align-items:center; padding:12px 16px; background:#f8fafc; border-bottom:1px solid #e5e7eb; font-size:16px; color:#111827; }
    .topbar-title { font-weight:bold; }
    .topbar-spacer { flex:1; }
    .topbar-btn { margin-left:8px; padding:4px 10px; font-size:13px; border-radius:999px; border:1px solid #d1d5db; background:#fff; cursor:pointer; }
    .topbar-btn:hover { background:#f3f4f6; }
    #timeline { height:720px; border:1px solid #e5e7eb; border-radius:10px; margin:12px; }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="topbar-title">Chinese Video Game Timeline</div>
    <div class="topbar-spacer"></div>
    <button id="btn-help" class="topbar-btn">Usage</button>
    <button id="btn-roadmap" class="topbar-btn">Roadmap</button>
    <button id="btn-feedback" class="topbar-btn">Feedback</button>
  </div>

  <div id="timeline"></div>

  <!-- Runtime parameters: MUST be defined before app.js -->
  <script>
    // Variant / locale
    window.TIMELINE_REGION = 'china';
    window.TIMELINE_LANG = 'en';

    // Initial visible range (recommended)
    // You can change these two dates freely per entry page (china-en / china-cn / world-en ...)
    window.TIMELINE_INITIAL_RANGE = {
      start: '1990-01-01',
      end: '2000-12-31',
    };

    // Optional: endpoints (set here if you want per-entry explicit config)
    // window.TIMELINE_ENDPOINT = 'https://script.google.com/macros/s/xxxxx/exec';
    // window.TIMELINE_FEEDBACK_ENDPOINT = 'https://script.google.com/macros/s/yyyyy/exec';

    // Optional: style remote compile
    // window.STYLE_COMPILE_ENDPOINT = '/api/compile-style';

    // Optional: defaults override (border width etc.)
    // window.DEFAULTS_OVERRIDE = { BORDER_WIDTH_PX: 2 };
  </script>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
