
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Matrix 日期映射测试</title>
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.7;
    }

    h1 { font-size: 24px; }

    .pass { color: #15803d; }
    .fail { color: #b91c1c; }

    .result {
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    #summary {
      font-weight: bold;
      margin: 20px 0;
    }
  </style>
</head>

<body>
  <h1>二维矩阵日期映射测试</h1>

  <p>
    此页面只测试日期计算，
    不连接Google Sheets，也不修改正式时间轴。
  </p>

  <div id="summary">正在测试……</div>
  <div id="results"></div>

  <script type="module">
    import {
      parseExactDate,
      parseMatrixDate,
      getDayIndex,
      buildDayColumns,
      buildMatrixData
    } from './matrix-data.js';

    const results = document.getElementById('results');
    const summary = document.getElementById('summary');

    let passed = 0;
    let failed = 0;

    function test(name, condition) {
      const div = document.createElement('div');
      div.className = 'result ' +
        (condition ? 'pass' : 'fail');

      div.textContent =
        (condition ? '✓ 通过：' : '✗ 失败：') + name;

      results.appendChild(div);

      if (condition) passed++;
      else failed++;
    }

    // 1. 横轴基本坐标
    test('1月00日位于第0列',
      getDayIndex(1, 0) === 0);

    test('1月1日位于第1列',
      getDayIndex(1, 1) === 1);

    test('2月00日位于第32列',
      getDayIndex(2, 0) === 32);

    test('2月29日位于第61列',
      getDayIndex(2, 29) === 61);

    test('3月00日位于第62列',
      getDayIndex(3, 0) === 62);

    test('12月31日位于第377列',
      getDayIndex(12, 31) === 377);

    // 2. 日期解析
    test('正确识别2000-02-00',
      parseMatrixDate('2000-02-00')?.precision
        === 'month');

    test('正确识别普通日期',
      parseMatrixDate('2000-02-20')?.precision
        === 'day');

    test('普通日期解析不接受00日',
      parseExactDate('2000-02-00') === null);

    test('拒绝非闰年2月29日',
      parseMatrixDate('2001-02-29') === null);

    test('接受闰年2月29日',
      parseMatrixDate('2000-02-29') !== null);

    test('拒绝2月30日',
      parseMatrixDate('2000-02-30') === null);

    test('拒绝无效月份',
      parseMatrixDate('2000-13-00') === null);

    // 3. 横轴完整性
    const columns = buildDayColumns();

    test('横轴共378列',
      columns.length === 378);

    test('所有横轴索引不重复',
      new Set(columns.map(c => c.index)).size === 378);

    test('所有横轴索引连续',
      columns.every((c, i) => c.index === i));

    test('每个月都有一个日期未知位置',
      columns.filter(c => c.precision === 'month')
        .length === 12);

    // 4. 事件分组
    const events = [
      { Start: '2000-02-00', Title: '月度事件A' },
      { Start: '2000-02-20', Title: '确定日期事件B' },
      { Start: '2000-02-20', Title: '确定日期事件C' },
      { Start: '2001-02-20', Title: '确定日期事件D' },
      { Start: '2001-02-29', Title: '非法日期事件E' }
    ];

    const matrix = buildMatrixData(events);

    test('成功收录4条事件',
      matrix.total === 4);

    test('跳过1条非法日期事件',
      matrix.skipped === 1);

    test('年份按照从新到旧排序',
      JSON.stringify(matrix.years) ===
        JSON.stringify([2001, 2000]));

    test('月度事件进入2月00日',
      matrix.cells.get(2000)?.get(32)?.length === 1);

    test('同日两条事件进入相同单元格',
      matrix.cells.get(2000)?.get(
        getDayIndex(2, 20)
      )?.length === 2);

    test('不同年份的事件分开存储',
      matrix.cells.get(2001)?.get(
        getDayIndex(2, 20)
      )?.length === 1);

    // 5. 测试总结
    summary.textContent =
      `测试完成：${passed}项通过，${failed}项失败。`;

    summary.className = failed === 0 ? 'pass' : 'fail';
  </script>
</body>
</html>
